[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-repo-memory"
version = "0.1.0"
description = "Synthetic-only local Windows memory storage core (no MCP transport)"
requires-python = ">=3.10"
dependencies = ["ruamel.yaml>=0.18.6,<0.19"]

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5", "pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
