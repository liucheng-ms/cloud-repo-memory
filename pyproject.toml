[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-repo-memory"
version = "0.1.0"
description = "Synthetic-only local Windows memory storage and read-only stdio MCP adapter"
requires-python = ">=3.10"
dependencies = [
    "ruamel.yaml>=0.18.6,<0.19",
    "mcp>=1.30,<2",
    "anyio>=4.9,<5",
    "jsonschema>=4.23,<5",
]

[project.scripts]
cloud-repo-memory = "cloud_repo_memory.server:main"

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "build>=1.2,<2"]

[tool.setuptools]
packages = ["cloud_repo_memory", "cloud_repo_memory.contracts"]
package-dir = {"cloud_repo_memory" = "src/cloud_repo_memory", "cloud_repo_memory.contracts" = "contracts"}

[tool.setuptools.package-data]
"cloud_repo_memory.contracts" = ["local-mvp-v1.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
